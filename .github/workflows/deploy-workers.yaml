name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Worker to deploy
        type: choice
        options: [all, ssr, worker]
        default: all

permissions:
  contents: read

jobs:
  deploy-ssr:
    name: "Deploy musiquiz-ssr"
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'ssr'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ssr
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: pnpm build:web:ssr

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:web:ssr

  deploy-worker:
    name: "Deploy musiquiz-worker"
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'worker'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:worker
